<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="506" height="506" x="3" y="3" rx="107" fill="none" stroke="#30363d" stroke-width="6"/>

  <!-- Glowing Compiler Glyphs -->
  <g filter="url(#glow)">
    <!-- Left Bracket < -->
    <polyline points="180,160 90,256 180,352" fill="none" stroke="url(#blueGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Slash / -->
    <line x1="285" y1="140" x2="225" y2="372" stroke="#3fb950" stroke-width="32" stroke-linecap="round"/>
    
    <!-- Right Bracket > -->
    <polyline points="332,160 422,256 332,352" fill="none" stroke="url(#blueGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Status Indicator Dot -->
  <circle cx="410" cy="110" r="22" fill="#3fb950"/>
  <circle cx="410" cy="110" r="30" fill="none" stroke="#3fb950" stroke-width="4" opacity="0.6"/>
</svg>
